name: Android checks

on:
  push:
    branches: [main, 'coderabbit/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Check Kotlin license notices
        run: python3 scripts/check-kotlin-headers.py
      - name: Build, test and lint
        run: ./gradlew assembleDebug test lintDebug --warning-mode all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*
